<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>番茄鐘專注手帳 - Focus Journal</title>
    
    <!-- iOS / PWA Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="專注手帳">
    <meta name="theme-color" content="#0f172a">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            500: '#10b981',
                            600: '#059669',
                        },
                        amber: {
                            500: '#f59e0b',
                        },
                        rose: {
                            500: '#f43f5e',
                            600: '#e11d48',
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', '"Segoe UI"', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Mobile Native App Touch Rules & Anti-Zoom */
        * {
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Input / Textarea Exception & iOS Auto-zoom Prevention (min-size 16px) */
        input, textarea, [contenteditable="true"] {
            -webkit-user-select: text !important;
            user-select: text !important;
            font-size: 16px !important;
        }

        /* Active Touch Scale Effect */
        button, .btn-active {
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.15s ease;
        }
        button:active, .btn-active:active {
            transform: scale(0.95);
            opacity: 0.88;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.3);
            border-radius: 4px;
        }
        
        /* Glassmorphism Navbar Header */
        .glass-header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        
        /* Pulse Animation for Timer Active */
        @keyframes subtle-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.95; transform: scale(1.01); }
        }
        .timer-running {
            animation: subtle-pulse 2s infinite ease-in-out;
        }

        /* Safe Area Padding for iOS Notch & Bottom Bar */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 12px); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-300">

    <!-- Main Outer Container (Centered Mobile View on Desktop) -->
    <div id="app-wrapper" class="w-full max-w-md md:max-w-lg mx-auto flex-1 flex flex-col min-h-screen relative shadow-2xl bg-slate-900 border-x border-slate-800/80">
        
        <!-- Header -->
        <header class="sticky top-0 z-30 glass-header border-b border-slate-800/80 px-5 pt-safe pb-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-500 to-amber-500 flex items-center justify-center shadow-lg shadow-rose-500/30">
                    <span class="text-xl">🍅</span>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-white">番茄鐘專注手帳</h1>
                    <p class="text-xs text-slate-400 font-medium">加油，正宇！保持覺察與專注</p>
                </div>
            </div>

            <!-- Total Completed Tomato Count Badge -->
            <div class="flex items-center space-x-1.5 bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700/80">
                <span class="text-base">🍅</span>
                <span id="tomato-counter" class="text-sm font-extrabold text-amber-400">0</span>
                <span class="text-xs text-slate-400">顆</span>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 px-4 py-5 space-y-5 overflow-y-auto pb-10">
            
            <!-- Mode Switcher Tabs (Focus vs Break) -->
            <div class="flex p-1 bg-slate-950/80 rounded-2xl border border-slate-800/80">
                <button id="mode-focus-btn" class="flex-1 py-2.5 rounded-xl text-xs font-bold text-white bg-rose-600 shadow-md transition-all flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-brain"></i>
                    <span>深度專注 (25m)</span>
                </button>
                <button id="mode-break-btn" class="flex-1 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white transition-all flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-mug-hot"></i>
                    <span>溫和休息 (5m)</span>
                </button>
            </div>

            <!-- Timer Card & Progress Bar Display -->
            <div class="relative overflow-hidden rounded-3xl bg-slate-800/80 border border-slate-700/60 p-6 shadow-xl text-center space-y-6">
                
                <!-- Status Badge -->
                <div class="inline-flex items-center space-x-2 px-3.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20" id="timer-status-badge">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                    <span id="status-text">準備好開始專注了嗎？</span>
                </div>

                <!-- Smooth Gradual Progress Bar -->
                <div class="space-y-1.5">
                    <div class="flex justify-between text-xs text-slate-400 font-medium px-1">
                        <span>專注進度</span>
                        <span id="progress-percentage">100%</span>
                    </div>
                    <div class="w-full bg-slate-900 h-3.5 rounded-full p-0.5 border border-slate-700/60 overflow-hidden">
                        <div id="progress-bar-fill" class="h-full rounded-full transition-all duration-300 ease-out shadow-sm" style="width: 100%; background: linear-gradient(90deg, #10b981, #f59e0b);"></div>
                    </div>
                </div>

                <!-- Big Countdown Digital Display -->
                <div id="timer-display-container" class="py-2">
                    <span id="timer-display" class="text-6xl font-black tracking-tight text-white font-mono drop-shadow-md">25:00</span>
                </div>

                <!-- Action Controls (Start / Pause / Give Up / Reset) -->
                <div class="flex items-center justify-center space-x-3 pt-2">
                    <button id="start-pause-btn" class="flex-1 py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm shadow-lg shadow-emerald-600/30 border border-emerald-400/40 flex items-center justify-center space-x-2">
                        <i id="start-icon" class="fa-solid fa-play"></i>
                        <span id="start-btn-text">開始專注</span>
                    </button>

                    <button id="giveup-btn" class="hidden flex-1 py-3.5 rounded-2xl bg-rose-600/20 text-rose-300 hover:bg-rose-600/30 font-bold text-sm border border-rose-500/40 flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-flag"></i>
                        <span>放棄專注</span>
                    </button>

                    <button id="reset-btn" class="w-12 h-12 rounded-2xl bg-slate-700/60 text-slate-300 hover:text-white flex items-center justify-center text-sm border border-slate-600/60">
                        <i class="fa-solid fa-rotate-left"></i>
                    </button>
                </div>
            </div>

            <!-- Distraction & Reflection Journal History Section -->
            <div class="rounded-3xl bg-slate-800/80 border border-slate-700/60 p-5 space-y-4 shadow-xl">
                <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-lightbulb text-amber-400"></i>
                        <h2 class="text-sm font-bold text-white">分心反思清單</h2>
                    </div>
                    <span class="text-[11px] text-slate-400 font-medium">累積 <span id="distraction-count" class="text-amber-400 font-bold">0</span> 次紀錄</span>
                </div>

                <p class="text-xs text-slate-400 leading-relaxed">
                    覺察是克服分心的第一步。在此記錄每次中途放棄的誘因，找到屬於你的專注節奏！
                </p>

                <!-- History List Container -->
                <div id="distraction-list" class="space-y-2.5 max-h-60 overflow-y-auto pr-1">
                    <!-- Dynamic rendering by JS -->
                </div>
            </div>

        </main>

        <!-- FULLSCREEN REFLECTION BLOCKING MODAL -->
        <div id="reflection-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-200">
            <div id="reflection-card" class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-5 shadow-2xl transform scale-95 transition-transform duration-200">
                
                <div class="text-center space-y-2">
                    <div class="w-14 h-14 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-400 flex items-center justify-center mx-auto text-2xl">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <h3 class="text-lg font-bold text-white">等一下，正宇！先停下來反思</h3>
                    <p class="text-xs text-slate-400">請誠實記錄剛才讓你分心的原因：</p>
                </div>

                <!-- Quick Selection Tags -->
                <div class="space-y-2">
                    <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block">快速選擇常用原因：</span>
                    <div class="flex flex-wrap gap-1.5" id="quick-tags">
                        <button class="quick-tag px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 border border-slate-700">📱 想滑 IG / 社群</button>
                        <button class="quick-tag px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 border border-slate-700">🍔 肚子餓 / 想吃東西</button>
                        <button class="quick-tag px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 border border-slate-700">🥱 太累想睡覺</button>
                        <button class="quick-tag px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 border border-slate-700">💬 回訊息 / 找朋友</button>
                    </div>
                </div>

                <!-- Custom Reason Input Box -->
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-300">詳細說明或自訂原因 *</label>
                    <textarea id="distraction-input" rows="3" placeholder="例如：收到 Line 通知，忍不住點進去看..." class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 transition-all resize-none"></textarea>
                </div>

                <!-- Action Buttons -->
                <div class="flex space-x-2 pt-1">
                    <button id="cancel-giveup-btn" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold border border-slate-700">
                        繼續專注
                    </button>
                    <button id="confirm-giveup-btn" class="flex-1 py-3 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-bold shadow-lg border border-rose-400/40">
                        確認放棄並記錄
                    </button>
                </div>

            </div>
        </div>

    </div>

    <!-- Application Script -->
    <script>
        // 1. Dynamic SVG Icon Data URI for PWA Favicon & Apple Icon
        const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
            <rect width="512" height="512" rx="128" fill="#0F172A"/>
            <circle cx="256" cy="270" r="160" fill="#E11D48"/>
            <path d="M256 110C270 140 290 150 310 150C290 130 280 110 270 80C250 80 230 100 210 110C230 120 245 125 256 110Z" fill="#10B981"/>
        </svg>`;
        const iconDataUri = 'data:image/svg+xml;base64,' + btoa(svgIcon);

        // Inject Favicon
        const faviconLink = document.createElement('link');
        faviconLink.rel = 'icon';
        faviconLink.type = 'image/svg+xml';
        faviconLink.href = iconDataUri;
        document.head.appendChild(faviconLink);

        // 2. Dynamic PWA Web App Manifest Registration
        const manifestObj = {
            name: "番茄鐘專注手帳 Pro",
            short_name: "專注手帳",
            description: "針對專注與分心自我覺察設計的番茄鐘手帳應用",
            start_url: "./",
            display: "standalone",
            background_color: "#0f172a",
            theme_color: "#0f172a",
            icons: [{ src: iconDataUri, sizes: "192x192 512x512", type: "image/svg+xml", purpose: "any maskable" }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(manifestBlob);
        document.head.appendChild(manifestLink);

        // 3. Dynamic Service Worker for Offline Capability
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'pomodoro-journal-v1';
                self.addEventListener('install', (e) => self.skipWaiting());
                self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
                self.addEventListener('fetch', (e) => {
                    e.respondWith(
                        caches.match(e.request).then((res) => res || fetch(e.request).catch(() => caches.match('./')))
                    );
                });
            `;
            const swBlob = new Blob([swCode], { type: 'text/javascript' });
            window.addEventListener('load', () => {
                navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
            });
        }

        // --- Application State Management ---
        const STORAGE_KEY = 'pomodoro_journal_data_v1';
        
        let state = {
            completedTomatoes: 0,
            distractions: [], // Array of { id, time, reason, mode }
            mode: 'focus', // 'focus' | 'break'
            duration: 25 * 60, // in seconds
            remaining: 25 * 60,
            isRunning: false
        };

        let timerInterval = null;

        // Web Audio API Synthesizer Sound Player
        function playCompletionTone() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                
                const playNote = (freq, startTime, duration) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + startTime);
                    gain.gain.setValueAtTime(0.25, ctx.currentTime + startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + startTime + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + startTime);
                    osc.stop(ctx.currentTime + startTime + duration);
                };

                // Warm Chime Chord (E5 -> G#5 -> B5 -> E6)
                playNote(659.25, 0, 0.4);
                playNote(830.61, 0.15, 0.4);
                playNote(987.77, 0.3, 0.5);
                playNote(1318.51, 0.45, 0.8);

                if (navigator.vibrate) navigator.vibrate([100, 100, 200]);
            } catch (e) {
                console.log('Audio Context error:', e);
            }
        }

        // LocalStorage Sync
        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state.completedTomatoes = parsed.completedTomatoes || 0;
                    state.distractions = parsed.distractions || [];
                }
            } catch (e) {}
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    completedTomatoes: state.completedTomatoes,
                    distractions: state.distractions
                }));
            } catch (e) {}
        }

        // Formatting Helpers
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function formatTimestamp(dateStr) {
            const d = new Date(dateStr);
            const month = d.getMonth() + 1;
            const date = d.getDate();
            const hours = String(d.getHours()).padStart(2, '0');
            const mins = String(d.getMinutes()).padStart(2, '0');
            return `${month}/${date} ${hours}:${mins}`;
        }

        // UI Update Functions
        function updateUI() {
            // Update Timer Display
            const display = document.getElementById('timer-display');
            display.textContent = formatTime(state.remaining);

            // Update Progress Bar Color & Fill Width
            const fill = document.getElementById('progress-bar-fill');
            const percentage = Math.round((state.remaining / state.duration) * 100);
            fill.style.width = `${percentage}%`;
            document.getElementById('progress-percentage').textContent = `${percentage}%`;

            // Dynamic Progress Color (Emerald -> Amber -> Rose)
            if (percentage > 50) {
                fill.style.background = 'linear-gradient(90deg, #10b981, #34d399)';
            } else if (percentage > 20) {
                fill.style.background = 'linear-gradient(90deg, #f59e0b, #fbbf24)';
            } else {
                fill.style.background = 'linear-gradient(90deg, #f43f5e, #fb7185)';
            }

            // Update Tomato Counters
            document.getElementById('tomato-counter').textContent = state.completedTomatoes;
            document.getElementById('distraction-count').textContent = state.distractions.length;

            // Start/Pause Button State
            const startBtnText = document.getElementById('start-btn-text');
            const startIcon = document.getElementById('start-icon');
            const giveupBtn = document.getElementById('giveup-btn');
            const startPauseBtn = document.getElementById('start-pause-btn');

            if (state.isRunning) {
                startBtnText.textContent = "暫停倒數";
                startIcon.className = "fa-solid fa-pause";
                giveupBtn.classList.remove('hidden');
                startPauseBtn.classList.replace('bg-emerald-600', 'bg-amber-600');
            } else {
                startBtnText.textContent = state.remaining < state.duration ? "繼續專注" : "開始專注";
                startIcon.className = "fa-solid fa-play";
                if (state.remaining === state.duration) {
                    giveupBtn.classList.add('hidden');
                }
                startPauseBtn.classList.replace('bg-amber-600', 'bg-emerald-600');
            }
        }

        function renderDistractions() {
            const listContainer = document.getElementById('distraction-list');
            listContainer.innerHTML = '';

            if (state.distractions.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-6 bg-slate-900/40 rounded-2xl border border-slate-800">
                        <i class="fa-solid fa-shield-cat text-slate-600 text-2xl mb-1"></i>
                        <p class="text-xs text-slate-500">太棒了！目前還沒有任何分心紀錄</p>
                    </div>
                `;
                return;
            }

            state.distractions.slice().reverse().forEach(item => {
                const el = document.createElement('div');
                el.className = 'p-3 rounded-2xl bg-slate-900/90 border border-slate-700/60 flex items-start space-x-3 text-xs';
                el.innerHTML = `
                    <div class="w-7 h-7 rounded-xl bg-rose-500/20 text-rose-400 flex items-center justify-center shrink-0 mt-0.5">
                        <i class="fa-solid fa-brain"></i>
                    </div>
                    <div class="flex-1 space-y-1">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-slate-200">${escapeHtml(item.reason)}</span>
                            <span class="text-[10px] text-slate-500">${formatTimestamp(item.time)}</span>
                        </div>
                    </div>
                `;
                listContainer.appendChild(el);
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // Timer Logic
        function startTimer() {
            if (state.isRunning) return;
            state.isRunning = true;
            document.getElementById('status-text').textContent = state.mode === 'focus' ? "極致專注中，加油正宇！" : "放鬆身心，準備下一輪！";
            
            timerInterval = setInterval(() => {
                if (state.remaining > 0) {
                    state.remaining--;
                    updateUI();
                } else {
                    // Countdown Finished!
                    clearInterval(timerInterval);
                    state.isRunning = false;
                    playCompletionTone();

                    if (state.mode === 'focus') {
                        state.completedTomatoes++;
                        saveData();
                        alert("🎉 太讚了正宇！你完成了一次深度專注，獲得一顆 🍅 番茄徽章！");
                    } else {
                        alert("☕ 休息時間結束，準備好開始下一個番茄鐘了嗎？");
                    }

                    resetTimer();
                }
            }, 1000);

            updateUI();
        }

        function pauseTimer() {
            if (!state.isRunning) return;
            clearInterval(timerInterval);
            state.isRunning = false;
            document.getElementById('status-text').textContent = "計時已暫停";
            updateUI();
        }

        function resetTimer() {
            pauseTimer();
            state.remaining = state.duration;
            document.getElementById('status-text').textContent = state.mode === 'focus' ? "準備好開始專注了嗎？" : "享受你的休息時間吧！";
            updateUI();
        }

        function switchMode(newMode) {
            pauseTimer();
            state.mode = newMode;
            
            const focusBtn = document.getElementById('mode-focus-btn');
            const breakBtn = document.getElementById('mode-break-btn');

            if (newMode === 'focus') {
                state.duration = 25 * 60;
                focusBtn.className = "flex-1 py-2.5 rounded-xl text-xs font-bold text-white bg-rose-600 shadow-md transition-all flex items-center justify-center space-x-2";
                breakBtn.className = "flex-1 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white transition-all flex items-center justify-center space-x-2";
            } else {
                state.duration = 5 * 60;
                breakBtn.className = "flex-1 py-2.5 rounded-xl text-xs font-bold text-white bg-emerald-600 shadow-md transition-all flex items-center justify-center space-x-2";
                focusBtn.className = "flex-1 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white transition-all flex items-center justify-center space-x-2";
            }

            resetTimer();
        }

        // Modal Reflection Interceptor Trigger
        const modal = document.getElementById('reflection-modal');
        const modalCard = document.getElementById('reflection-card');
        const distractionInput = document.getElementById('distraction-input');

        function openReflectionModal() {
            pauseTimer();
            distractionInput.value = '';
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-95');
            modalCard.classList.add('scale-100');
        }

        function closeReflectionModal() {
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-95');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        // Event Listeners Registration
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            updateUI();
            renderDistractions();

            // Mode Toggle
            document.getElementById('mode-focus-btn').addEventListener('click', () => switchMode('focus'));
            document.getElementById('mode-break-btn').addEventListener('click', () => switchMode('break'));

            // Start / Pause Control
            document.getElementById('start-pause-btn').addEventListener('click', () => {
                if (state.isRunning) {
                    pauseTimer();
                } else {
                    startTimer();
                }
            });

            // Reset Control
            document.getElementById('reset-btn').addEventListener('click', () => {
                if (state.remaining < state.duration) {
                    openReflectionModal();
                } else {
                    resetTimer();
                }
            });

            // Give Up Button (Triggers Interceptor)
            document.getElementById('giveup-btn').addEventListener('click', openReflectionModal);

            // Modal: Quick Tag Click
            document.getElementById('quick-tags').addEventListener('click', (e) => {
                const btn = e.target.closest('.quick-tag');
                if (btn) {
                    distractionInput.value = btn.textContent.trim();
                }
            });

            // Modal: Cancel Giveup (Continue timer)
            document.getElementById('cancel-giveup-btn').addEventListener('click', () => {
                closeReflectionModal();
                startTimer();
            });

            // Modal: Confirm Giveup & Save Reason
            document.getElementById('confirm-giveup-btn').addEventListener('click', () => {
                const reason = distractionInput.value.trim();
                if (!reason) {
                    alert("請填寫分心原因，這能幫助你更好了解自己喔！");
                    return;
                }

                state.distractions.push({
                    id: Date.now().toString(),
                    time: new Date().toISOString(),
                    reason: reason,
                    mode: state.mode
                });

                saveData();
                renderDistractions();
                closeReflectionModal();
                resetTimer();
            });
        });
    </script>
</body>
</html>
